<title>우리 집 장보기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: one narrow column — add bar on top, one card per store aisle, reset button at the bottom */
  :root {
    --bg: #fff0f4;
    --card: #ffffff;
    --pink: #ec7fa6;
    --pink-dark: #c9507f;
    --pink-soft: #ffe1ea;
    --text: #5a3a46;
    --muted: #a8818f;
    --line: #f6cfdc;
    --on-pink: #ffffff;
    --shadow: rgba(201, 80, 127, .12);
    --font: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --font-title: "Jua", "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #2a1d23; --card: #3a2830; --pink: #f19bbb; --pink-dark: #f7b8cf;
      --pink-soft: #4a3039; --text: #f6e3ea; --muted: #c09aa8; --line: #573a45;
      --on-pink: #2a1d23; --shadow: rgba(0, 0, 0, .3); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #2a1d23; --card: #3a2830; --pink: #f19bbb; --pink-dark: #f7b8cf;
    --pink-soft: #4a3039; --text: #f6e3ea; --muted: #c09aa8; --line: #573a45;
    --on-pink: #2a1d23; --shadow: rgba(0, 0, 0, .3); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.5; }
  .wrap {
    max-width: 640px; margin: 0 auto;
    padding-block: 24px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 14px;
  }
  header h1 { margin: 0; font-family: var(--font-title); font-weight: 400; font-size: 1.9rem; color: var(--pink-dark); text-wrap: balance; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: .95rem; }
  .status { font-size: .85rem; color: var(--pink-dark); background: var(--pink-soft); border-radius: 12px; padding: 8px 12px; }

  .add {
    background: var(--card); border-radius: 20px; padding: 14px;
    box-shadow: 0 4px 14px var(--shadow);
    display: grid; grid-template-columns: minmax(0, 1fr) 90px; gap: 8px;
  }
  .add input, .add select {
    width: 100%; min-width: 0; border: 2px solid var(--line); border-radius: 12px;
    padding: 10px 12px; font: inherit; color: var(--text); background: var(--card);
  }
  .add input:focus-visible, .add select:focus-visible { outline: none; border-color: var(--pink); }
  .btn {
    border: 0; border-radius: 12px; background: var(--pink); color: var(--on-pink);
    font: inherit; font-weight: 700; padding: 10px 14px; cursor: pointer;
  }
  .btn:hover { background: var(--pink-dark); }
  .btn:focus-visible { outline: 3px solid var(--pink-soft); outline-offset: 2px; }
  .btn:disabled { opacity: .5; cursor: default; }

  .section { background: var(--card); border-radius: 20px; padding: 14px 16px 8px; box-shadow: 0 4px 14px var(--shadow); }
  .section h2 { margin: 0 0 6px; font-size: 1.05rem; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .count { font-size: .8rem; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); font-size: .9rem; padding: 4px 0 10px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px dashed var(--line); }
  li:first-child { border-top: 0; }
  .toggle {
    flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0;
    border: 0; background: none; padding: 4px 0; margin: 0; font: inherit; color: inherit;
    text-align: left; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .box {
    width: 22px; height: 22px; border: 2px solid var(--pink); border-radius: 7px;
    flex-shrink: 0; display: grid; place-content: center; background: var(--card);
    color: var(--on-pink); font-size: 14px; font-weight: 700; line-height: 1;
  }
  li.done .box { background: var(--pink); }
  .toggle:focus-visible .box { outline: 3px solid var(--pink-soft); outline-offset: 2px; }
  .toggle:focus-visible { outline: none; }
  .name { overflow-wrap: anywhere; }
  .qty {
    width: 72px; border: 1px solid var(--line); border-radius: 10px; padding: 4px 8px;
    font: inherit; font-size: .85rem; color: var(--text); background: var(--pink-soft); text-align: center;
  }
  .qty:focus-visible { outline: none; border-color: var(--pink); background: var(--card); }
  .del { border: 0; background: none; color: var(--muted); font-size: 1rem; cursor: pointer; padding: 4px 8px; border-radius: 8px; }
  .del:hover, .del:focus-visible { color: var(--pink-dark); background: var(--pink-soft); outline: none; }
  li.done .name { text-decoration: line-through; color: var(--muted); }
  li.done .qty { opacity: .5; }

  .bottom { text-align: center; margin-top: 8px; }
  .btn.ghost { background: var(--card); color: var(--pink-dark); border: 2px solid var(--pink); }
  .btn.ghost:hover { background: var(--pink-soft); }
  .readonly .add, .readonly .del, .readonly .bottom { display: none; }
  @media (prefers-reduced-motion: no-preference) { li { transition: opacity .15s; } }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">

<div class="wrap" id="app">
  <header>
    <h1>🛒 우리 집 장보기</h1>
    <p id="summary">목록을 불러오는 중이에요</p>
  </header>

  <div class="status" id="status" hidden></div>

  <form class="add" id="addForm" autocomplete="off">
    <input id="newName" placeholder="살 것 (예: 대파)" aria-label="살 것" required>
    <input id="newQty" placeholder="수량" aria-label="수량">
    <select id="newCat" aria-label="코너"></select>
    <button class="btn" type="submit" id="addBtn">추가</button>
  </form>

  <div id="list" style="display:flex;flex-direction:column;gap:14px"></div>

  <div class="bottom">
    <button class="btn ghost" id="clearDone" type="button">🧹 담은 것 비우기</button>
  </div>
</div>

<script>
  const CATS = [
    { id: "veg",   label: "🥬 채소·과일" },
    { id: "meat",  label: "🥩 정육·수산" },
    { id: "dairy", label: "🥛 유제품·계란" },
    { id: "grain", label: "🍚 곡물·가공식품" },
    { id: "home",  label: "🧻 생활용품" },
  ];
  const $ = id => document.getElementById(id);
  const listEl = $("list"), statusEl = $("status"), catSel = $("newCat");
  catSel.innerHTML = CATS.map(c => `<option value="${c.id}">${c.label}</option>`).join("");

  let items = [];
  let loaded = false;
  let col = null;

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  }
  function showStatus(msg) { statusEl.textContent = msg || ""; statusEl.hidden = !msg; }

  function render() {
    // Keep focus/typing in a qty box intact while others' changes arrive
    const active = document.activeElement;
    const keepQty = active && active.classList.contains("qty") ? { id: active.closest("li")?.dataset.id, val: active.value, pos: active.selectionStart } : null;

    listEl.innerHTML = CATS.map(c => {
      const inCat = items.filter(it => it.cat === c.id).sort((a, b) => (a.created || 0) - (b.created || 0));
      const sorted = [...inCat.filter(it => !it.done), ...inCat.filter(it => it.done)];
      const doneN = inCat.length - inCat.filter(it => !it.done).length;
      const rows = sorted.map(it => `
        <li class="${it.done ? "done" : ""}" data-id="${esc(it.id)}">
          <button class="toggle" type="button" role="checkbox" aria-checked="${it.done ? "true" : "false"}">
            <span class="box" aria-hidden="true">${it.done ? "✓" : ""}</span>
            <span class="name">${esc(it.name)}</span>
          </button>
          <input class="qty" value="${esc(it.qty)}" placeholder="수량" aria-label="${esc(it.name)} 수량">
          <button class="del" type="button" aria-label="${esc(it.name)} 지우기">✕</button>
        </li>`).join("");
      return `<section class="section">
        <h2>${c.label} <span class="count">${inCat.length ? doneN + " / " + inCat.length : ""}</span></h2>
        ${inCat.length ? `<ul>${rows}</ul>` : `<div class="empty">${loaded ? "아직 항목이 없어요. 위에서 추가해 보세요" : "불러오는 중…"}</div>`}
      </section>`;
    }).join("");

    if (keepQty && keepQty.id) {
      const el = listEl.querySelector(`li[data-id="${CSS.escape(keepQty.id)}"] .qty`);
      if (el) { el.value = keepQty.val; el.focus(); try { el.setSelectionRange(keepQty.pos, keepQty.pos); } catch (e) {} }
    }

    const total = items.length, done = items.filter(it => it.done).length;
    $("summary").textContent = !loaded ? "목록을 불러오는 중이에요"
      : total ? `${total}개 중 ${done}개 담았어요 · 가족과 함께 보는 목록` : "살 것을 추가해 보세요";
  }

  function itemOf(el) {
    const li = el.closest("li");
    return li ? items.find(it => it.id === li.dataset.id) : null;
  }
  function failed(e) {
    if (e && e.code === "invalid_argument") {
      document.body.classList.add("readonly");
      showStatus("이 목록은 보기만 할 수 있어요. 고치려면 목록 주인에게 편집 권한을 받아 주세요.");
    } else if (e && e.code === "quota_exceeded") {
      showStatus("저장 공간이 가득 찼어요. 필요 없는 항목을 지운 뒤 다시 해 주세요.");
    } else {
      showStatus("저장하지 못했어요. 인터넷 연결을 확인하고 다시 해 주세요.");
    }
  }

  // Coalesce qty typing into one write per pause
  const qtyTimers = {};
  function saveQty(it, value) {
    clearTimeout(qtyTimers[it.id]);
    qtyTimers[it.id] = setTimeout(() => {
      col.doc(it.id).update({ qty: value.trim() }).catch(failed);
    }, 600);
  }

  // One tap = one item. Ignore repeat taps on the same item while its save is in flight,
  // and redraw after the tap has fully finished so the list never moves under the pointer mid-click.
  const busy = new Set();
  listEl.addEventListener("click", e => {
    const btn = e.target.closest(".toggle");
    if (!btn || !col) return;
    e.preventDefault();
    e.stopPropagation();
    const it = itemOf(btn);
    if (!it || busy.has(it.id)) return;
    busy.add(it.id);
    it.done = !it.done;
    setTimeout(render, 0);
    col.doc(it.id).update({ done: it.done })
      .catch(err => { it.done = !it.done; render(); failed(err); })
      .finally(() => setTimeout(() => busy.delete(it.id), 300));
  });
  listEl.addEventListener("input", e => {
    if (!col || !e.target.classList.contains("qty")) return;
    const it = itemOf(e.target);
    if (it) { it.qty = e.target.value; saveQty(it, e.target.value); }
  });
  listEl.addEventListener("click", e => {
    if (!col || !e.target.classList.contains("del")) return;
    const it = itemOf(e.target);
    if (!it) return;
    items = items.filter(x => x !== it);
    render();
    col.doc(it.id).delete().catch(failed);
  });

  $("addForm").addEventListener("submit", e => {
    e.preventDefault();
    if (!col) return;
    const name = $("newName").value.trim();
    if (!name) return;
    const body = { cat: catSel.value, name, qty: $("newQty").value.trim(), done: false, created: Date.now() };
    col.add(body).catch(failed);
    $("newName").value = ""; $("newQty").value = "";
    $("newName").focus();
  });

  $("clearDone").addEventListener("click", async () => {
    if (!col) return;
    const doneItems = items.filter(it => it.done);
    doneItems.forEach(it => { it.done = false; });
    render();
    for (const it of doneItems) {
      try { await col.doc(it.id).update({ done: false }); } catch (e) { failed(e); break; }
    }
  });

  render();

  (async () => {
    const db = window.claude?.use ? await window.claude.use("db").catch(() => null) : null;
    if (!db) {
      loaded = true; render();
      document.body.classList.add("readonly");
      showStatus("목록을 불러올 수 없어요. claude.ai에 로그인한 상태로 이 링크를 열어 주세요.");
      return;
    }
    col = db.collection("items");
    const timer = setTimeout(() => {
      showStatus(items.length ? "최신 내용이 아닐 수 있어요. 인터넷 연결을 확인해 주세요." : "목록에 아직 연결하지 못했어요. 인터넷 연결을 확인해 주세요.");
    }, 10000);
    col.onSnapshot(snap => {
      items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if (!snap.metadata.fromCache) { clearTimeout(timer); if (!statusEl.textContent.startsWith("이 목록은")) showStatus(""); }
      loaded = true;
      render();
    }, err => {
      clearTimeout(timer);
      loaded = true; render();
      showStatus("목록 연결이 끊겼어요. 페이지를 다시 열어 주세요.");
    });
  })();
</script>
